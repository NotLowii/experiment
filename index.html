
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 7 - Mini Open World</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    color: white;
    background: #111c;
    padding: 15px 20px;
    border-radius: 10px;
    line-height: 1.8;
}

#help {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: white;
    background: #111c;
    padding: 12px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div id="hud">
    <h2>GTA 7</h2>
    <div>Player: <span id="status">Walking</span></div>
    <div>Wanted Level: <span id="wanted">☆☆☆☆☆</span></div>
    <div>Cash: $<span id="cash">500</span></div>
</div>

<div id="help">
    WASD - Move / Drive<br>
    E - Enter / Exit Vehicle<br>
    Shift - Run / Accelerate
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "e") {
        toggleCar();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const player = {
    x: 400,
    y: 400,
    speed: 3,
    size: 16,
    inCar: false
};

const car = {
    x: 480,
    y: 400,
    angle: 0,
    speed: 0,
    color: "#e63946"
};

let wanted = 0;
let cash = 500;

// City buildings
const buildings = [];

for (let x = -1000; x < 3000; x += 300) {
    for (let y = -1000; y < 3000; y += 300) {
        buildings.push({
            x: x + 30,
            y: y + 30,
            w: 180,
            h: 180,
            color: ["#59616a", "#6b6260", "#535d58"][
                Math.floor(Math.random() * 3)
            ]
        });
    }
}

function toggleCar() {
    if (!player.inCar) {
        const d = Math.hypot(
            player.x - car.x,
            player.y - car.y
        );

        if (d < 65) {
            player.inCar = true;
            document.getElementById("status").textContent = "Driving";
        }
    } else {
        player.inCar = false;

        player.x = car.x + 35;
        player.y = car.y + 35;

        document.getElementById("status").textContent = "Walking";
    }
}

function update() {

    if (player.inCar) {

        if (keys["w"]) car.speed += 0.12;
        if (keys["s"]) car.speed -= 0.12;

        if (keys["shift"]) car.speed += 0.08;

        car.speed *= 0.97;

        car.speed = Math.max(-5, Math.min(9, car.speed));

        if (keys["a"]) car.angle -= 0.045;
        if (keys["d"]) car.angle += 0.045;

        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        player.x = car.x;
        player.y = car.y;

    } else {

        let speed = keys["shift"] ? 5 : 3;

        if (keys["w"]) player.y -= speed;
        if (keys["s"]) player.y += speed;
        if (keys["a"]) player.x -= speed;
        if (keys["d"]) player.x += speed;

    }

    document.getElementById("wanted").textContent =
        "★".repeat(wanted) + "☆".repeat(5 - wanted);

    document.getElementById("cash").textContent = cash;
}

function drawCity() {

    ctx.fillStyle = "#43804c";
    ctx.fillRect(-5000, -5000, 10000, 10000);

    // Roads
    ctx.fillStyle = "#33383c";

    for (let x = -3000; x < 4000; x += 300) {
        ctx.fillRect(x - 15, -4000, 230, 8000);
    }

    for (let y = -3000; y < 4000; y += 300) {
        ctx.fillRect(-4000, y - 15, 8000, 230);
    }

    // Road lane markings
    ctx.strokeStyle = "#d6c878";
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);

    for (let x = -3000; x < 4000; x += 300) {
        ctx.beginPath();
        ctx.moveTo(x + 100, -4000);
        ctx.lineTo(x + 100, 4000);
        ctx.stroke();
    }

    for (let y = -3000; y < 4000; y += 300) {
        ctx.beginPath();
        ctx.moveTo(-4000, y + 100);
        ctx.lineTo(4000, y + 100);
        ctx.stroke();
    }

    ctx.setLineDash([]);

    // Buildings
    buildings.forEach(b => {
        ctx.fillStyle = "#222";
        ctx.fillRect(b.x + 8, b.y + 8, b.w, b.h);

        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        ctx.fillStyle = "#a9c6c7";

        for (let i = 20; i < b.w - 10; i += 40) {
            ctx.fillRect(b.x + i, b.y + 20, 20, 25);
            ctx.fillRect(b.x + i, b.y + 90, 20, 25);
        }
    });
}

function drawCar() {

    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    ctx.fillStyle = "#111";
    ctx.fillRect(-24, -17, 52, 38);

    ctx.fillStyle = car.color;
    ctx.fillRect(-25, -13, 50, 26);

    ctx.fillStyle = "#a9d5e8";
    ctx.fillRect(-10, -11, 20, 22);

    ctx.fillStyle = "#111";
    ctx.fillRect(17, -13, 7, 7);
    ctx.fillRect(17, 6, 7, 7);

    ctx.restore();
}

function drawPlayer() {

    if (player.inCar) return;

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(player.x, player.y + 3, 15, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e9b98b";
    ctx.beginPath();
    ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#2878d0";
    ctx.fillRect(player.x - 8, player.y + 8, 16, 15);
}

function render() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    // Camera follows player
    ctx.translate(
        canvas.width / 2 - player.x,
        canvas.height / 2 - player.y
    );

    drawCity();
    drawCar();
    drawPlayer();

    ctx.restore();

    requestAnimationFrame(render);
}

function gameLoop() {
    update();
    requestAnimationFrame(gameLoop);
}

gameLoop();
render();

</script>
</body>
</html>
